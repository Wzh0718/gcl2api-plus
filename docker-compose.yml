version: '3.8'

services:
  gcli2api:
    image: ghcr.io/wzh0718/gcl2api-plus:latest
    container_name: gcli2api
    restart: unless-stopped
    network_mode: host
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    environment:
      # Password configuration (choose one)
      # Option 1: Use common password
      - PASSWORD=${PASSWORD:-pwd}
      # Option 2: Use separate passwords (uncomment if needed)
      # - API_PASSWORD=${API_PASSWORD:-your_api_password}
      # - PANEL_PASSWORD=${PANEL_PASSWORD:-your_panel_password}

      # Server configuration
      - PORT=${PORT:-7861}
      - HOST=${HOST:-0.0.0.0}

      # Optional: Google credentials from environment
      # - GOOGLE_CREDENTIALS=${GOOGLE_CREDENTIALS}

      # Optional: Logging configuration
      # - LOG_LEVEL=${LOG_LEVEL:-info}

      # Optional: Redis configuration (billing mirror/dashboard)
      - REDIS_URL=${REDIS_URL:-}
      - REDIS_USER=${REDIS_USER:-}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}

      # Optional: MongoDB configuration (for distributed storage)
      # - MONGODB_URI=${MONGODB_URI}
      # - MONGODB_DATABASE=${MONGODB_DATABASE:-gcli2api}

      # Optional: PostgreSQL configuration (for distributed storage)
      # - POSTGRES_DSN=${POSTGRES_DSN}

      # Optional: Proxy configuration
      # - PROXY=${PROXY}

      # Optional: Antigravity account-bound IP and eligibility checks
      - ANTIGRAVITY_CLI_VERSION=${ANTIGRAVITY_CLI_VERSION:-1.2.7}
      - ANTIGRAVITY_CLI_OS_TYPE=${ANTIGRAVITY_CLI_OS_TYPE:-linux}
      - ANTIGRAVITY_CLI_ARCH=${ANTIGRAVITY_CLI_ARCH:-amd64}
      - ANTIGRAVITY_CLI_AUTH_METHOD=${ANTIGRAVITY_CLI_AUTH_METHOD:-consumer}
      - ANTIGRAVITY_NETWORK_CHECK_ENABLED=${ANTIGRAVITY_NETWORK_CHECK_ENABLED:-false}
      - ANTIGRAVITY_NETWORK_CHECK_TTL_SECONDS=${ANTIGRAVITY_NETWORK_CHECK_TTL_SECONDS:-1800}
      - ANTIGRAVITY_EGRESS_IP_CHECK_URL=${ANTIGRAVITY_EGRESS_IP_CHECK_URL:-}
    volumes:
      - ./data/creds:/app/creds
    # API 代理在高并发下需要远高于默认 1024 的文件描述符上限
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    # 限制容器日志体积，避免 json-file 无限增长；应用侧 log.txt 由 LOG_MAX_BYTES 轮转
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    healthcheck:
      # 优先使用分离密码 API_PASSWORD；仅设置通用 PASSWORD 时回退到它
      test: ["CMD-SHELL", "python -c \"import sys, urllib.request, os; port = os.environ.get('PORT', '7861'); pw = os.environ.get('API_PASSWORD') or os.environ.get('PASSWORD', 'pwd'); req = urllib.request.Request(f'http://localhost:{port}/v1/models', headers={'Authorization': 'Bearer ' + pw}); sys.exit(0 if urllib.request.urlopen(req, timeout=10).getcode() == 200 else 1)\""]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 40s

