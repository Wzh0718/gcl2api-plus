name: PostgreSQL main store tests
on:
  pull_request:
    branches: [dev, custom]
    paths:
      - 'src/**'
      - 'scripts/postgres/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/main-postgres-tests.yml'
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.12-alpine
        env:
          POSTGRES_PASSWORD: integration-test
          POSTGRES_DB: gcli_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
      - run: uv run --python 3.13 --extra dev python -m pytest -q tests/test_main_postgres.py
        env:
          TEST_MAIN_POSTGRES_DSN: postgresql://postgres:integration-test@127.0.0.1:5432/gcli_test
