name: Release to GHCR

# 从本仓库当前分支直接构建 amd64/arm64 多架构镜像，
# 推送 vYYYYMMDD + latest 到 GitHub Container Registry (ghcr.io)。
# 仅手动触发（Actions 页面 workflow_dispatch），
# 与本地手动执行 ./scripts/build-and-push.sh 完全等价。

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  GHCR_IMAGE: ghcr.io/wzh0718/gcl2api-plus

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Set up QEMU
        # arm64 层在 amd64 Runner 上通过 QEMU 模拟构建，多架构发布必需
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Run gates, build and push
        env:
          IMAGE_NAME: ${{ env.GHCR_IMAGE }}
        run: ./scripts/build-and-push.sh
